{% extends "base_auth.html" %}
{% block titulo %}Acesso negado{% endblock %}

<div class="text-center">
  <p class="font-mono text-5xl font-bold text-[var(--kronus-gray-300)]">403</p>
  <h1 class="mt-4 font-display text-xl font-semibold text-[var(--kronus-gray-900)]">Acesso negado</h1>
  <p class="mt-2 text-sm text-[var(--kronus-gray-600)]">{{ mensagem|default:"Você não tem permissão para acessar esta página." }}</p>

</div>
{% endblock %}
