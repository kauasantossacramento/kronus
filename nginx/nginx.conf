# ══════════════════════════════════════════════════════════════
# Kronus — proxy reverso (kronus.online)
# ══════════════════════════════════════════════════════════════
upstream kronus_http { server web:8000; }
upstream kronus_ws   { server daphne:8001; }

server {
    listen 80;
    server_name kronus.online www.kronus.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kronus.online www.kronus.online;

    ssl_certificate     /etc/letsencrypt/live/kronus.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kronus.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # O frame do totem chega em base64 JPEG (~50KB); 10M cobre também
    # o upload de atestados (limite de 10MB da Seção 8.6).
    client_max_body_size 10M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # WebSocket — heartbeat do totem e dashboard em tempo real
    location /ws/ {
        proxy_pass http://kronus_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://kronus_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
