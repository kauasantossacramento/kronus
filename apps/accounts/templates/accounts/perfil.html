{% extends "base.html" %}

{% block conteudo %}
<div class="card max-w-2xl p-6">
  <form method="post" enctype="multipart/form-data" class="space-y-5">
    {% csrf_token %}
    {% for campo in form %}
      <div>
        <label for="{{ campo.id_for_label }}" class="block text-sm font-medium text-[var(--kronus-gray-700)]">{{ campo.label }}</label>
        <div class="mt-1.5">{{ campo }}</div>
        {% if campo.errors %}<p class="mt-1 text-xs text-red-600">{{ campo.errors.0 }}</p>{% endif %}
      </div>
    {% endfor %}
    <div class="flex justify-end gap-2 pt-2">
      <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
