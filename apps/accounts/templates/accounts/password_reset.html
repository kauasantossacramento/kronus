{% extends "base_auth.html" %}
{% block conteudo %}
<h1 class="font-display text-xl font-semibold text-[var(--kronus-gray-900)]">Recuperar senha</h1>
<p class="mt-1 text-sm text-[var(--kronus-gray-500)]">Informe o e-mail cadastrado e enviaremos um link de redefinição.</p>
<form method="post" class="mt-6 space-y-5">
  {% csrf_token %}
  <div>
    <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-[var(--kronus-gray-700)]">E-mail</label>
    <div class="mt-1.5">
      <input type="email" name="email" id="{{ form.email.id_for_label }}" required autocomplete="email"
             class="block w-full rounded-lg border-0 px-3 py-2.5 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 focus:ring-2 focus:ring-inset focus:ring-[var(--kronus-primary-500)] sm:text-sm">
    </div>
  </div>
  <button type="submit" class="btn btn-primary w-full py-2.5">Enviar link</button>
  <p class="text-center"><a href="{% url 'accounts:login' %}" class="text-sm text-[var(--kronus-primary-600)] hover:underline">Voltar ao login</a></p>
</form>
{% endblock %}
