{% comment %}
  As credenciais de acesso, para o colaborador.

  Estilo embutido e tabela em vez de flex: cliente de e-mail ignora
  <link>, descarta boa parte de <style> no <head>, e o Outlook renderiza
  com um motor antigo.

  A senha aparece em destaque porque é o que a pessoa veio buscar — e
  aparece uma vez só: o sistema não a guarda em lugar nenhum depois de
  enviada.
{% endcomment %}
<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Seu acesso ao Kronus</title></head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;
                      box-shadow:0 1px 3px rgba(16,24,40,0.08);">

          <tr>
            <td align="center" style="background:#101828;padding:24px;">
              {% if empresa.logo %}
                <img src="{{ empresa.logo.url }}" alt="{{ empresa.nome_exibicao }}"
                     style="max-height:40px;max-width:200px;display:block;">
              {% else %}
                <p style="margin:0;color:#ffffff;font-size:17px;font-weight:bold;">
                  {{ empresa.nome_exibicao }}
                </p>
              {% endif %}
            </td>
          </tr>

          <tr>
            <td style="padding:30px 32px 10px;">
              <h1 style="margin:0 0 12px;font-size:20px;color:#101828;font-weight:bold;">
                Olá, {{ colaborador.nome_exibicao }}
              </h1>
              <p style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#475467;">
                Seu acesso ao Kronus foi criado. Com ele você consulta seu ponto,
                vê o saldo de horas e assina o espelho pelo navegador.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="background:#f9fafb;border-radius:8px;">
                <tr>
                  <td style="padding:18px 20px;">
                    <p style="margin:0;font-size:11px;color:#667085;text-transform:uppercase;letter-spacing:0.05em;">Usuário</p>
                    <p style="margin:4px 0 14px;font-size:16px;color:#101828;font-family:monospace;">{{ usuario }}</p>

                    <p style="margin:0;font-size:11px;color:#667085;text-transform:uppercase;letter-spacing:0.05em;">Senha provisória</p>
                    <p style="margin:4px 0 0;font-size:22px;color:#101828;font-family:monospace;font-weight:bold;letter-spacing:0.03em;">{{ senha }}</p>
                  </td>
                </tr>
              </table>
              <p style="margin:12px 0 0;font-size:13px;color:#667085;">
                Você vai trocar esta senha no primeiro acesso.
              </p>
            </td>
          </tr>

          {% if url_entrada %}
            <tr>
              <td align="center" style="padding:24px 32px 6px;">
                <a href="{{ url_entrada }}"
                   style="display:inline-block;background:#101828;color:#ffffff;
                          text-decoration:none;padding:13px 32px;border-radius:8px;
                          font-size:15px;font-weight:bold;">
                  Entrar no Kronus
                </a>
              </td>
            </tr>
          {% endif %}

          <tr>
            <td align="center" style="padding:22px 32px 28px;">
              <div style="height:1px;background:#eaecf0;"></div>
              <p style="margin:16px 0 0;font-size:11px;color:#b0b7c3;line-height:1.5;">
                Não compartilhe esta senha com ninguém.<br>
                Kronus — ponto eletrônico da {{ empresa.nome_exibicao }}.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
